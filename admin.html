
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Church Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #10251d;
      color: #fff;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background: #fff;
      color: #222;
      border-radius: 14px;
      box-shadow: 0 12px 35px #0005;
    }

    h1 {
      margin-top: 0;
      color: #174b35;
    }

    p {
      line-height: 1.5;
      color: #555;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 7px;
      background: #176640;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      overflow-wrap: anywhere;
    }

    .back {
      display: block;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <h1>Administrator Login</h1>

    <p>Imperishable Crown Bible Baptist Church</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Log In
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>

    <a class="back" href="index.html">
      Back to church website
    </a>
  </main>

  <script>
    const API =
      "https://imperishable-church-mpesa-backend-fa2a.onrender.com";

    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      message.textContent = "Signing in...";

      try {
        const response = await fetch(`${API}/api/admin/login`, {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: form.username.value.trim(),
            password: form.password.value
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.message || "Login failed."
          );
        }

        const check = await fetch(`${API}/api/admin/me`, {
          credentials: "include",
          cache: "no-store"
        });

        if (!check.ok) {
          throw new Error(
            "Login succeeded, but the session could not be verified. Check browser cookie restrictions and backend CORS settings."
          );
        }

        const session = await check.json();

        if (!session.success) {
          throw new Error("Your administrator session could not be verified.");
        }

        message.textContent =
          "Login successful. Opening dashboard...";

        window.location.href = "admin-dashboard.html";

      } catch (error) {
        message.textContent =
          error.message || "Could not connect. Please try again.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
