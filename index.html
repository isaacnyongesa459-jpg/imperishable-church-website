<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="description"
        content="Welcome to Imperishable Crown Outreach Baptist Church. A place of worship, love and community.">

    <meta name="theme-color" content="#050a11">

    <title>Imperishable Crown Outreach Baptist Church</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- CINEMATIC CHURCH BACKGROUND -->
    <main class="splash-container">

        <div class="church-icon">
            <i class="fas fa-church"></i>
        </div>

        <p class="welcome-label">YOU ARE WELCOME</p>

        <h1>
            IMPERISHABLE CROWN
            <span>OUTREACH BAPTIST CHURCH</span>
        </h1>

        <div class="gold-line"></div>

        <p class="tagline">
            A Place of Worship, Love &amp; Community
        </p>

        <a href="home.html" class="join-btn" id="joinButton">
            <span>JOIN US SUNDAY</span>
            <i class="fas fa-arrow-right"></i>
        </a>

        <p class="entrance-note">
            <i class="fas fa-door-open"></i>
            Step inside and experience God's presence
        </p>

    </main>


    <!-- LEFT CHURCH DOOR -->
    <div class="door door-left" aria-hidden="true">
        <div class="door-frame">
            <div class="door-panel-design"></div>
            <div class="door-handle"></div>
        </div>
    </div>


    <!-- RIGHT CHURCH DOOR -->
    <div class="door door-right" aria-hidden="true">
        <div class="door-frame">
            <div class="door-panel-design"></div>
            <div class="door-handle"></div>
        </div>
    </div>


    <!-- BIBLE VERSE -->
    <footer class="verse">
        <i class="fas fa-bible"></i>

        <p>
            "Come, let us worship and bow down"
            <span>— Psalm 95:6</span>
        </p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
