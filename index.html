<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Welcome to Imperishable Crown Outreach Baptist Church — a place of worship, community, and spiritual growth.">
  <title>Imperishable Crown Outreach Baptist Church | Welcome</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Main CSS -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ==============================
       WELCOME / SPLASH SECTION
  =============================== -->
  <main class="splash-container">
    
    <!-- Church Icon -->
    <div class="church-icon" aria-hidden="true">
      <i class="fas fa-church"></i>
    </div>

    <!-- Church Name & Welcome Message -->
    <h1>
      Welcome to Imperishable Crown
      <span>Outreach Baptist Church</span>
    </h1>

    <!-- Tagline -->
    <p class="tagline">
      A place of worship, community, and spiritual growth. Join us as we journey together in faith.
    </p>

    <!-- Call to Action Buttons -->
    <div class="button-group">
      <!-- Primary Button -->
      <a href="home.html" class="join-btn" id="joinButton">
        View Services
      </a>
      
      <!-- Secondary Button -->
      <a href="give.html" class="secondary-btn">
        Give Online
      </a>
    </div>

  </main>

  <!-- ==============================
       BIBLE VERSE
  =============================== -->
  <footer class="verse">
    <i class="fas fa-bible" aria-hidden="true"></i>
    <p>
      "Come, let us worship and bow down"
      <span>— Psalm 95:6</span>
    </p>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
  
</body>
</html>
